<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>sbmlsim-web in reveal.js slides</title>
    <link rel="stylesheet" href="../node_modules/reveal.js/dist/reset.css" />
    <link rel="stylesheet" href="../node_modules/reveal.js/dist/reveal.css" />
    <link rel="stylesheet" href="../node_modules/reveal.js/dist/theme/black.css" />
    <style>
      /*
       * The dark theme of the deck reaches the panel through custom properties,
       * which is the whole of the contract between a host and the element: the
       * element declares none of them on itself, so a rule on any ancestor wins.
       * The text, its softer variant, the surface of the controls and the first
       * colour of the ramp, which is nearly black, are the four the light
       * values are unreadable on a dark slide for.
       */
      .reveal {
        --sbmlsim-fg: rgb(236 238 241);
        --sbmlsim-fg-soft: rgb(168 176 189);
        --sbmlsim-bg-card: rgb(38 42 48);
        --sbmlsim-ramp-1: rgb(133 140 255);
      }
      .reveal sbmlsim-panel {
        display: block;
        max-width: 880px;
        margin: 0 auto;
        text-align: left;
        font-size: 0.6em;
      }
    </style>
  </head>
  <body>
    <div class="reveal">
      <div class="slides">
        <section>
          <h2>Hydrochlorothiazide in renal impairment</h2>
          <p>Use the arrow keys to move between slides.</p>
        </section>
        <section id="panel-slide">
          <!--
            A touch on a knob must not turn the page, so the element is marked
            for reveal.js, which ignores the swipes which start on it.
          -->
          <sbmlsim-panel
            endpoint=""
            model="hctz"
            panel="renal"
            heading-level="3"
            data-prevent-swipe
          ></sbmlsim-panel>
        </section>
        <section>
          <h2>The end</h2>
        </section>
      </div>
    </div>
    <script src="../dist/sbmlsim-web.iife.js"></script>
    <script src="../node_modules/reveal.js/dist/reveal.js"></script>
    <script>
      const panel = document.querySelector('sbmlsim-panel')
      const deck = new Reveal({
        // set as the deck of a page which embeds panels is meant to be; it does
        // not keep the keys of a knob from the deck, as a deck which is not
        // embedded always has focus: the element does that itself, by keeping
        // the arrow keys to the knob which has them
        keyboardCondition: 'focused',
        hash: true,
        width: 1100,
        height: 700,
      })
      // a slide is activated when it is shown and frozen when it is left, so a
      // deck of many panels holds one request at a time
      deck.on('slidechanged', (event) => {
        if (event.currentSlide.contains(panel)) {
          void panel.activate()
        } else {
          panel.freeze()
        }
      })
      deck.initialize().then(() => {
        if (deck.getCurrentSlide().contains(panel)) {
          void panel.activate()
        }
      })
    </script>
  </body>
</html>
