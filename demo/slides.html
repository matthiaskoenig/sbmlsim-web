<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>sbmlsim-web in reveal.js slides</title>
    <link rel="stylesheet" href="../node_modules/reveal.js/dist/reset.css" />
    <link rel="stylesheet" href="../node_modules/reveal.js/dist/reveal.css" />
    <link rel="stylesheet" href="../node_modules/reveal.js/dist/theme/black.css" />
    <style>
      /*
       * A dark deck says that it is dark: the theme of reveal.js paints the
       * slides dark and declares no colour scheme, so the deck declares it, and
       * the panel takes the dark half of its table from it, as the native
       * widgets of its controls do. The rest is the contract between a host and
       * the element, the custom properties, which reach it from any ancestor:
       * the surface of the panel is the one of the slide, and its text is set
       * in the sizes a projected slide needs, since every length of the panel
       * follows its two font sizes and no font size of the page.
       */
      .reveal {
        color-scheme: dark;
        --sbmlsim-bg: var(--r-background-color);
        --sbmlsim-font-size: 16px;
        --sbmlsim-font-size-small: 14px;
      }
      .reveal sbmlsim-panel {
        max-width: 880px;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <div class="reveal">
      <div class="slides">
        <section>
          <h2>Hydrochlorothiazide</h2>
          <p>Use the arrow keys to move between slides.</p>
        </section>
        <section id="panel-slide">
          <!--
            A touch on a knob must not turn the page, so the element is marked
            for reveal.js, which ignores the swipes which start on it. The deck
            shows the panel of the dose, whose knobs are a slider and a select,
            because a drag and the arrow keys on a slider are what a deck has to
            keep to the knob; the panel with the study data is on the other two
            hosts.
          -->
          <sbmlsim-panel
            endpoint=""
            model="hctz"
            panel="dose_plasma"
            heading-level="3"
            data-prevent-swipe
          ></sbmlsim-panel>
        </section>
        <section>
          <h2>The end</h2>
        </section>
      </div>
    </div>
    <script src="../dist/sbmlsim-web.iife.js"></script>
    <script src="../node_modules/reveal.js/dist/reveal.js"></script>
    <script>
      const panel = document.querySelector('sbmlsim-panel')
      const deck = new Reveal({
        // this option is set because the deck of a page with panels is meant to
        // use it, but it does not keep a knob's keys from the deck: a deck
        // which is not embedded always has focus. The element does that itself,
        // by keeping the arrow keys to the knob which has them.
        keyboardCondition: 'focused',
        hash: true,
        width: 1100,
        height: 700,
      })
      // a slide is activated when it is shown and frozen when it is left, so a
      // deck of many panels holds one request at a time
      deck.on('slidechanged', (event) => {
        if (event.currentSlide.contains(panel)) {
          void panel.activate()
        } else {
          panel.freeze()
        }
      })
      deck.initialize().then(() => {
        if (deck.getCurrentSlide().contains(panel)) {
          void panel.activate()
        }
      })
    </script>
  </body>
</html>
