name: publish

# A tag `vX.Y.Z` of a commit publishes that commit to npm, after the checks of
# continuous integration passed for it, the end to end tests included. The
# package is published with the provenance of npm, which ties it to this
# workflow and this commit, through the trusted publishing of npm: npm accepts
# the OIDC token of this workflow (`id-token: write`) for the package, so no
# token of npm is stored anywhere (npm 11.5.1 or newer).
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # the provenance of npm is signed with the OIDC token of the workflow
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Check the version of the tag
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "the tag ${GITHUB_REF_NAME} is not the version ${version} of package.json"
            exit 1
          fi
          test -f "release-notes/${version}.md" || { echo "release-notes/${version}.md is missing"; exit 1; }
      - name: Check that npm publishes with trusted publishing
        run: |
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!ok) { console.error(`npm ${process.argv[1]} has no trusted publishing, 11.5.1 or newer has`); process.exit(1); }
          ' "$(npm --version)"
      - run: npm ci
      - run: npm run build
      - run: npm publish --provenance --access public
