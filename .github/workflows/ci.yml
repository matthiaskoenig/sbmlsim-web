name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The end to end tests drive the Chrome of the runner against the python
      # endpoint, which is another repository: without a checkout of it
      # (SBMLSIM_REPO or ../sbmlsim) the step reports that it skipped and passes.
      - run: npm run e2e
